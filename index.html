    width:full?"100%":"auto", padding:small?"8px 14px":"12px 20px",

function ModuloHome({ onNavCampo, onNavClima, onNavCuaderno, onNavPlagas, onNavMercado, onNavCostos, onNavAsistente }) {
  const urgentes = TAREAS_DATA.filter(t => t.urgencia === "urgente" && t.estado !== "Completado");
  const totalCostos = COSTOS_DATA.filter(c => c.estado === "Pagado").reduce((s,c)=>s+c.monto,0);
  const pendienteCostos = COSTOS_DATA.filter(c => c.estado === "Pendiente").reduce((s,c)=>s+c.monto+c.iva,0);

  return (
    <div>
      <div style={{ marginBottom:16 }}>
        <div style={{ fontSize:11, color:C.muted, textTransform:"uppercase", letterSpacing:1 }}>Galleguillos Agrícola SpA</div>
        <div style={{ fontSize:22, fontWeight:700, color:C.earth, marginTop:4 }}>Bienvenido, Marcelo 🌿</div>
        <div style={{ fontSize:12, color:C.muted, marginTop:2 }}>Millahue, San Vicente · Temporada 2026–2027</div>
      </div>

      {/* Alertas urgentes */}
      {urgentes.map(t => (
        <div key={t.id} style={{ background:C.redPale, border:`1.5px solid ${C.red}44`,
          borderLeft:`5px solid ${C.red}`, borderRadius:14, padding:"11px 14px",
          marginBottom:10, cursor:"pointer" }} onClick={onNavAsistente}>
          <div style={{ display:"flex", gap:10, alignItems:"center" }}>
            <span style={{ fontSize:20 }}>🚨</span>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:13, fontWeight:700, color:C.earth }}>{t.nombre}</div>
              <div style={{ fontSize:11, color:C.muted, marginTop:1 }}>{t.tipo} · {t.fecha}</div>
            </div>
            <Badge color={C.red} bg={C.redPale}>Urgente</Badge>
          </div>
        </div>
      ))}

      {/* Stats */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:18 }}>
        {[
          { icon:"🍑", label:"Ciruelo D'Agen",   valor:"3 há",             color:C.green,  onClick:onNavCampo },
          { icon:"🌽", label:"Maíz (Fase puente)",valor:"3 há",             color:C.gold,   onClick:onNavCampo },
          { icon:"✅", label:"Pagado a la fecha", valor:`$${(totalCostos/1e6).toFixed(1)}M`, color:C.blue,   onClick:onNavCostos },
          { icon:"⏳", label:"Pendiente de pago", valor:`$${(pendienteCostos/1e6).toFixed(1)}M`, color:C.orange, onClick:onNavCostos },
        ].map((s,i) => (
          <Card key={i} onClick={s.onClick} style={{ padding:"14px 16px", cursor:"pointer" }}>
            <div style={{ fontSize:20, marginBottom:4 }}>{s.icon}</div>
            <div style={{ fontSize:18, fontWeight:700, color:s.color }}>{s.valor}</div>
            <div style={{ fontSize:10, color:C.muted, marginTop:2 }}>{s.label}</div>
          </Card>
        ))}
      </div>

      {/* Mis campos */}
      <SLabel>🌿 Mis campos — Millahue</SLabel>
      {CAMPOS.map(c => {
        const etapas = FENOLOGIA[c.cultivo]||[];
        const etapa  = etapas[c.etapaActual];
        const m      = MERCADO_DATA[c.cultivo];
        return (
          <Card key={c.id} onClick={onNavCampo} style={{ marginBottom:10, cursor:"pointer" }}>
            <div style={{ display:"flex", gap:12, alignItems:"flex-start" }}>
              <span style={{ fontSize:32 }}>{c.icon}</span>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:14, fontWeight:700, color:C.earth }}>{c.nombre}</div>
                <div style={{ fontSize:11, color:C.muted }}>📍 {c.comuna} · {c.ha} ha · {c.variedad}</div>
                <div style={{ display:"flex", gap:6, marginTop:7, flexWrap:"wrap" }}>
                  {etapa && <Badge color={C.gold} bg={C.goldPale}>{etapa.icon} {etapa.nombre}</Badge>}
                  {m && <Badge color={m.cambio>=0?C.green:C.red} bg={m.cambio>=0?C.greenPale:C.redPale}>
                    {m.cambio>=0?"▲":"▼"} {m.unidad==="$/kg seco"?`$${m.precio.toLocaleString('es-CL')}`:m.precio} {m.unidad}
                  </Badge>}
                </div>
              </div>
              <span style={{ color:C.muted, fontSize:18 }}>›</span>
            </div>
            <div style={{ marginTop:10, display:"flex", gap:3 }}>
              {etapas.map((_,i) => (
                <div key={i} style={{ flex:1, height:4, borderRadius:2,
                  background: i<c.etapaActual?C.green:i===c.etapaActual?C.gold:C.border }} />
              ))}
            </div>
          </Card>
        );
      })}

      {/* Tareas próximas */}

// ─── COSTOS ───────────────────────────────────────────────────────────────────
function ModuloCostos() {
  const [costos, setCostos] = useState(COSTOS_DATA);
  const [filtro, setFiltro] = useState("todos");
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ desc:"", categoria:"Insumo", rubro:"Ciruelo", monto:"", iva:true, estado:"Pendiente", proveedor:"", fecha:"" });

  const estadoColor = {
    "Pagado":       { c:C.green,  bg:C.greenPale  },
    "Pendiente":    { c:C.orange, bg:C.goldPale   },
    "Por contratar":{ c:C.purple, bg:C.purplePale },
    "Por comprar":  { c:C.blue,   bg:C.bluePale   },
    "Por cotizar":  { c:C.earth,  bg:"#f5f0e8"    },
  };

  const filtrados = filtro === "todos" ? costos : costos.filter(c => c.estado === filtro);

  const totalNeto   = costos.reduce((a,c) => a + (c.neto ?? c.monto ?? 0), 0);
  const totalIva    = costos.reduce((a,c) => a + (c.iva  ?? 0), 0);
  const totalPagado = costos.filter(c => c.estado==="Pagado").reduce((a,c) => a + (c.neto ?? c.monto ?? 0) + (c.iva ?? 0), 0);
  const ivaRecuperable = costos.filter(c => c.estado==="Pagado" && (c.iva ?? 0) > 0).reduce((a,c) => a + (c.iva ?? 0), 0);

  const fmt = n => `$${(n/1e3).toFixed(0)}K`;
  const fmtM = n => `$${(n/1e6).toFixed(2)}M`;

  const guardar = () => {
    if (!form.desc || !form.monto) return;
    const neto  = parseInt(form.monto.replace(/\D/g,"")) || 0;
    const iva   = form.iva ? Math.round(neto * 0.19) : 0;
    const nuevo = { id: Date.now(), ...form, neto, iva, total: neto + iva };
    setCostos(prev => [nuevo, ...prev]);
    setShowForm(false);
    setForm({ desc:"", categoria:"Insumo", rubro:"Ciruelo", monto:"", iva:true, estado:"Pendiente", proveedor:"", fecha:"" });
  };

  const TABS = ["todos","Pagado","Pendiente","Por contratar","Por comprar","Por cotizar"];

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:16 }}>
        <div>
          <div style={{ fontSize:20, fontWeight:700, color:C.earth }}>Costos e IVA</div>
          <div style={{ fontSize:12, color:C.muted, marginTop:2 }}>Temporada 2025–2026 · Galleguillos Agrícola SpA</div>
        </div>
        <button onClick={() => setShowForm(v => !v)} style={{
          background: showForm ? C.muted : C.green, color:C.white, border:"none",
          borderRadius:20, padding:"7px 16px", fontSize:13, cursor:"pointer", fontFamily:"inherit", fontWeight:600,
        }}>{showForm ? "✕ Cancelar" : "+ Agregar"}</button>
      </div>

      {/* Resumen */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:16 }}>
        {[
          { label:"Total neto estimado",  val:fmtM(totalNeto),       color:C.earth  },
          { label:"IVA acumulado",         val:fmtM(totalIva),        color:C.purple },
          { label:"Pagado a la fecha",     val:fmtM(totalPagado),     color:C.green  },
          { label:"IVA recuperable (F29)", val:fmtM(ivaRecuperable),  color:C.blue   },
        ].map(s => (
          <div key={s.label} style={{ background:C.white, borderRadius:12, padding:"12px 14px",
            boxShadow:"0 1px 4px rgba(0,0,0,0.07)" }}>
            <div style={{ fontSize:10, color:C.muted, textTransform:"uppercase", letterSpacing:0.5, marginBottom:4 }}>{s.label}</div>
            <div style={{ fontSize:20, fontWeight:700, color:s.color }}>{s.val}</div>
          </div>
        ))}
      </div>

      {/* Formulario */}
      {showForm && (
        <div style={{ background:C.white, borderRadius:14, padding:16, marginBottom:16,
          boxShadow:"0 2px 8px rgba(0,0,0,0.08)", border:`1.5px solid ${C.greenLight}` }}>
          <div style={{ fontSize:14, fontWeight:700, color:C.earth, marginBottom:12 }}>Nuevo Costo</div>
          {[
            ["Descripción", "desc", "text"],
            ["Proveedor",   "proveedor", "text"],
            ["Fecha",       "fecha", "date"],
            ["Monto neto (sin IVA)", "monto", "text"],
          ].map(([lbl,key,type]) => (
            <div key={key} style={{ marginBottom:10 }}>
              <div style={{ fontSize:11, color:C.muted, marginBottom:3 }}>{lbl}</div>
              <input type={type} value={form[key]}
                onChange={e => setForm(p => ({...p,[key]:e.target.value}))}
                style={{ width:"100%", padding:"8px 10px", borderRadius:8, border:`1px solid ${C.border}`,
                  fontSize:13, fontFamily:"inherit", boxSizing:"border-box" }} />
            </div>
          ))}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:10 }}>
            {[
              ["Categoría","categoria",["Insumo","Maquinaria","Mano de obra","Infraestructura","Servicio","Trámite"]],
              ["Estado","estado",["Pendiente","Pagado","Por contratar","Por comprar","Por cotizar"]],
              ["Rubro","rubro",["Ciruelo","Maíz","Ambos","Empresa"]],
            ].map(([lbl,key,opts]) => (
              <div key={key}>
                <div style={{ fontSize:11, color:C.muted, marginBottom:3 }}>{lbl}</div>
                <select value={form[key]} onChange={e => setForm(p => ({...p,[key]:e.target.value}))}
                  style={{ width:"100%", padding:"8px 10px", borderRadius:8, border:`1px solid ${C.border}`,
                    fontSize:13, fontFamily:"inherit", background:C.white }}>
                  {opts.map(o => <option key={o}>{o}</option>)}
                </select>
              </div>
            ))}
          </div>
          <label style={{ display:"flex", alignItems:"center", gap:8, fontSize:13, marginBottom:12, cursor:"pointer" }}>
            <input type="checkbox" checked={form.iva} onChange={e => setForm(p => ({...p, iva:e.target.checked}))} />
            Afecto a IVA (19%)
          </label>
          <button onClick={guardar} style={{
            width:"100%", background:C.green, color:C.white, border:"none",
            borderRadius:10, padding:"10px 0", fontSize:14, fontWeight:700, cursor:"pointer", fontFamily:"inherit",
          }}>Guardar costo</button>
        </div>
      )}

      {/* Filtros */}
      <div style={{ display:"flex", gap:6, overflowX:"auto", paddingBottom:4, marginBottom:14 }}>
        {TABS.map(t => (
          <button key={t} onClick={() => setFiltro(t)} style={{
            whiteSpace:"nowrap", padding:"5px 12px", borderRadius:20, fontSize:11, fontWeight:600,
            border:`1.5px solid ${filtro===t ? C.green : C.border}`,
            background: filtro===t ? C.green : C.white,
            color: filtro===t ? C.white : C.muted, cursor:"pointer", fontFamily:"inherit",
          }}>{t === "todos" ? `Todos (${costos.length})` : `${t} (${costos.filter(c=>c.estado===t).length})`}</button>
        ))}
      </div>

      {/* Lista */}
      <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
        {filtrados.length === 0 && (
          <div style={{ textAlign:"center", color:C.muted, padding:"32px 0", fontSize:13 }}>Sin registros en esta categoría</div>
        )}
        {filtrados.map(c => {
          const sc = estadoColor[c.estado] || { c:C.muted, bg:"#f5f5f5" };
          return (
            <div key={c.id} style={{ background:C.white, borderRadius:12, padding:"12px 14px",
              boxShadow:"0 1px 4px rgba(0,0,0,0.07)" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:6 }}>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:13, fontWeight:600, color:C.text, marginBottom:2 }}>{c.desc}</div>
                  <div style={{ fontSize:11, color:C.muted }}>
                    {c.categoria ?? c.cat} · {c.rubro}{c.proveedor ? ` · ${c.proveedor}` : ""}{c.fecha ? ` · ${c.fecha}` : ""}
                  </div>
                </div>
                <span style={{ background:sc.bg, color:sc.c, fontSize:10, fontWeight:700,
                  padding:"3px 9px", borderRadius:20, whiteSpace:"nowrap", marginLeft:8 }}>{c.estado}</span>
              </div>
              <div style={{ display:"flex", gap:12, fontSize:12, color:C.muted }}>
                <span>Neto: <b style={{color:C.text}}>{fmt(c.neto ?? c.monto ?? 0)}</b></span>
                {(c.iva ?? 0) > 0 && <span>IVA: <b style={{color:C.purple}}>{fmt(c.iva)}</b></span>}
                <span>Total: <b style={{color:C.earth}}>{fmt((c.neto ?? c.monto ?? 0) + (c.iva ?? 0))}</b></span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ModuloAsistente() {
  const [msgs, setMsgs] = useState([
    { role:"assistant", content:"Hola Marcelo 👋 Soy tu asistente para **Galleguillos Agrícola SpA**.\n\nPuedo ayudarte con:\n• **Asesoría agronómica** — ciruelo D'Agen en establecimiento (año 0)\n• **Trámites urgentes** — DGA, SAG, CNR, BancoEstado\n• **Registrar faenas** — cuaderno SAG, aplicaciones, riegos\n• **Costos e IVA** — qué es recuperable en F29\n• **Decisiones de mercado** — precio seco vs export\n\n⚠️ Pendiente urgente: **inscripción DGA** para los derechos del pozo. Sin eso no hay riego legal.\n\n¿En qué te ayudo hoy?" }
  ]);
  const [input, setInput]   = useState("");
  const [loading, setLoading] = useState(false);
  const [apiKey, setApiKey]   = useState(() => localStorage.getItem("surco_api_key") || "");
  const [showKey, setShowKey] = useState(false);
  const [tempKey, setTempKey] = useState("");
  const endRef = useRef(null);

  useEffect(() => { endRef.current?.scrollIntoView({ behavior:"smooth" }); }, [msgs]);

  const saveKey = () => {
    localStorage.setItem("surco_api_key", tempKey.trim());
    setApiKey(tempKey.trim());
    setShowKey(false);
  };

  const QUICK = [
    { label:"⚡ Esta semana",      msg:"¿Qué debo hacer esta semana en mis ciruelas D'Agen? Considera la fenología actual y el clima." },
    { label:"🧊 Proteger helada",  msg:"Hay helada -2°C el viernes durante floración. ¿Qué medidas concretas tomo para proteger mis ciruelas?" },
    { label:"💰 ¿Cuándo vender?",  msg:"Analizando el precio FOB actual de ciruela D'Agen y las tendencias de mercado, ¿cuándo y a qué destino me conviene vender?" },
    { label:"📋 Registrar faena",  msg:"Quiero registrar una nueva aplicación en el cuaderno SAG." },
    { label:"👷 Control costos",   msg:"Ayúdame a llevar el control de costos y jornales de esta temporada." },
  ];

  const renderText = (text) => {
    return text.split('\n').map((line, i) => {
      const parts = line.split(/\*\*(.*?)\*\*/g);
      const rendered = parts.map((p, j) => j % 2 === 1 ? <strong key={j}>{p}</strong> : p);
      return <div key={i} style={{ minHeight: line === '' ? 8 : 'auto', lineHeight:1.7 }}>{rendered}</div>;
    });
  };

  const sendMsg = async (text) => {
    const msg = (text || input).trim();
    if (!msg) return;
    if (!apiKey) { setTempKey(""); setShowKey(true); return; }

    const newMsgs = [...msgs, { role:"user", content:msg }];
    setMsgs(newMsgs);
    setInput("");
    setLoading(true);

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-api-key": apiKey,
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-calls":"true",
        },
        body: JSON.stringify({
          model:"claude-haiku-4-5-20251001",
          max_tokens:1024,
          system: SYSTEM_PROMPT,
          messages: newMsgs.map(m => ({ role:m.role, content:m.content })),
        }),
      });
      const data = await res.json();
      if (data.content?.[0]?.text) {
        setMsgs(prev => [...prev, { role:"assistant", content:data.content[0].text }]);
      } else {
        throw new Error(data.error?.message || "Error de API");
      }
    } catch (e) {
      setMsgs(prev => [...prev, { role:"assistant", content:`❌ Error al conectar: ${e.message}.\n\nVerifica tu API key en el botón 🔑 arriba.` }]);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"calc(100vh - 170px)" }}>

      {/* Modal API key */}
      {showKey && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.55)",
          display:"flex", alignItems:"center", justifyContent:"center", zIndex:600, padding:20 }}>
          <div style={{ background:C.panel, borderRadius:18, padding:24, width:"100%", maxWidth:360 }}>
            <div style={{ fontSize:16, fontWeight:700, color:C.earth, marginBottom:6 }}>🔑 API Key de Anthropic</div>
            <div style={{ fontSize:13, color:C.muted, marginBottom:16, lineHeight:1.6 }}>
              Obtén tu clave gratis en <strong>console.anthropic.com</strong>.<br/>Se guarda solo en este dispositivo.
            </div>
            <input type="password" value={tempKey} onChange={e=>setTempKey(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&saveKey()}
              placeholder="sk-ant-api03-..." autoFocus
              style={{ width:"100%", padding:"10px 12px", borderRadius:8,
                border:`1.5px solid ${C.green}`, fontSize:13, fontFamily:"inherit",
                boxSizing:"border-box", marginBottom:12, outline:"none" }} />
            <div style={{ display:"flex", gap:8 }}>
              <Btn full small onClick={saveKey}>Guardar y continuar</Btn>
              <Btn full small variant="ghost" onClick={()=>setShowKey(false)}>Cancelar</Btn>
            </div>
          </div>
        </div>
      )}

      {/* Cabecera */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10, flexShrink:0 }}>
        <div>
          <div style={{ fontSize:16, fontWeight:700, color:C.earth }}>Asistente Agrícola</div>
          <div style={{ fontSize:11, color:C.muted }}>Galleguillos Agrícola · D'Agen, Curicó</div>
        </div>
        <button onClick={()=>{ setTempKey(apiKey); setShowKey(true); }} style={{
          background: apiKey?C.greenPale:C.redPale,
          color: apiKey?C.green:C.red,
          border:`1px solid ${apiKey?C.green+"55":C.red+"55"}`,
          borderRadius:20, padding:"5px 12px", fontSize:11, cursor:"pointer", fontFamily:"inherit" }}>
          {apiKey ? "🔑 Conectado" : "🔑 Configurar"}
        </button>
      </div>

      {/* Acciones rápidas */}
      <div style={{ display:"flex", gap:6, overflowX:"auto", paddingBottom:8, marginBottom:6, flexShrink:0 }}>
        {QUICK.map((q,i)=>(
          <button key={i} onClick={()=>sendMsg(q.msg)} disabled={loading} style={{
            flex:"0 0 auto", background:C.panel, border:`1px solid ${C.border}`,
            borderRadius:20, padding:"6px 12px", fontSize:11, cursor:"pointer",
            fontFamily:"inherit", color:C.earth, whiteSpace:"nowrap",
          }}>{q.label}</button>
        ))}
      </div>

      {/* Mensajes */}
      <div style={{ flex:1, overflowY:"auto", paddingRight:2 }}>
        {msgs.map((m,i)=>(
          <div key={i} style={{ marginBottom:14, display:"flex", flexDirection:"column",
            alignItems: m.role==="user"?"flex-end":"flex-start" }}>
            {m.role==="assistant" && (
              <div style={{ fontSize:10, color:C.muted, marginBottom:3 }}>🌿 Asistente Surco</div>
            )}
            <div style={{
              background: m.role==="user"?C.green:C.panel,
              color: m.role==="user"?C.white:C.text,
              border: m.role==="user"?"none":`1px solid ${C.border}`,
              borderRadius: m.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px",
              padding:"10px 14px", maxWidth:"85%", fontSize:13,
            }}>
              {renderText(m.content)}
            </div>
          </div>
        ))}
        {loading && (
          <div style={{ display:"flex", alignItems:"flex-start", marginBottom:14 }}>
            <div style={{ background:C.panel, border:`1px solid ${C.border}`,
              borderRadius:"16px 16px 16px 4px", padding:"12px 16px", fontSize:13, color:C.muted }}>
              ✦ Pensando...
            </div>
          </div>
        )}
        <div ref={endRef} />
      </div>

      {/* Input */}
      <div style={{ display:"flex", gap:8, paddingTop:8, flexShrink:0 }}>
        <input value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendMsg(); } }}
          placeholder="Escribe tu consulta..." disabled={loading}
          style={{ flex:1, padding:"12px 16px", borderRadius:24,
            border:`1.5px solid ${C.border}`, fontSize:13, fontFamily:"inherit",
            background:C.panel, outline:"none", color:C.text }} />
        <button onClick={()=>sendMsg()} disabled={loading||!input.trim()} style={{
          background: (loading||!input.trim())?C.border:C.green,
          color:C.white, border:"none", borderRadius:24,
          padding:"12px 18px", fontSize:16, cursor:(loading||!input.trim())?"default":"pointer",
          transition:"background .2s",
        }}>➤</button>
      </div>
    </div>
  );
}

// ─── MAIN APP UNIFICADA ───────────────────────────────────────────────────────
const NAV = [
  { id:"home",      icon:"🏠", label:"Inicio"    },
  { id:"campo",     icon:"🌿", label:"Cultivos"  },
  { id:"cuaderno",  icon:"📋", label:"Cuaderno"  },
  { id:"costos",    icon:"💰", label:"Costos"    },
  { id:"plagas",    icon:"🔍", label:"Plagas"    },
  { id:"asistente", icon:"✦",  label:"Asistente" },
];

const SECTION_TITLES = {
  home:"Inicio", campo:"Mis Cultivos", cuaderno:"Cuaderno SAG",
  clima:"Clima y Alertas", plagas:"Plagas", mercado:"Mercado",
  costos:"Costos e IVA", asistente:"Asistente Agrícola",
};

function SurcoApp() {

  const [toast, setToast]   = useState(null);

  const showToast = msg => {
    setToast(msg);
    setTimeout(() => setToast(null), 3000);
  };

  const navTo = t => setTab(t);

  return (
    <div style={{ minHeight:"100vh", background:C.bg, fontFamily:"'Georgia', serif",
      color:C.text, maxWidth:480, margin:"0 auto", paddingBottom:80 }}>

      {/* TOAST */}
      {toast && (
        <div style={{ position:"fixed", top:20, left:"50%", transform:"translateX(-50%)",
          background:C.green, color:C.white, padding:"12px 20px", borderRadius:12,
          fontSize:13, fontWeight:600, zIndex:999, whiteSpace:"nowrap",
          boxShadow:"0 4px 24px rgba(0,0,0,0.18)", pointerEvents:"none" }}>
          {toast}
        </div>
      )}

      {/* HEADER */}
      <div style={{ background:C.green, padding:"14px 20px",
        display:"flex", alignItems:"center", justifyContent:"space-between",
        position:"sticky", top:0, zIndex:50 }}>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <span style={{ fontSize:22 }}>🌿</span>
          <div>
            <div style={{ color:C.white, fontWeight:700, fontSize:18, letterSpacing:0.5 }}>Surco</div>
            <div style={{ color:C.greenLight, fontSize:10, letterSpacing:2, textTransform:"uppercase" }}>
              {SECTION_TITLES[tab] || "Surco"}
            </div>
          </div>
        </div>
        <div style={{ display:"flex", gap:8, alignItems:"center" }}>
          {/* Botón mercado */}
          <button onClick={() => navTo("mercado")} style={{
            background:"rgba(255,255,255,0.15)", border:"none", color:C.white,
            borderRadius:20, padding:"5px 12px", fontSize:12, cursor:"pointer", fontFamily:"inherit",
          }}>📊 Mercado</button>
          <div style={{ background:"rgba(255,255,255,0.15)", borderRadius:20,
            padding:"5px 12px", fontSize:12, color:C.white }}>
            🚨 3
          </div>
        </div>
      </div>

      {/* CONTENT */}
      <div style={{ padding:"20px 16px" }}>
        {tab==="home"      && <ModuloHome onNavCampo={()=>navTo("campo")} onNavClima={()=>navTo("clima")} onNavCuaderno={()=>navTo("cuaderno")} onNavPlagas={()=>navTo("plagas")} onNavMercado={()=>navTo("mercado")} onNavCostos={()=>navTo("costos")} onNavAsistente={()=>navTo("asistente")} />}
        {tab==="campo"     && <ModuloCampo />}
        {tab==="cuaderno"  && <ModuloCuaderno />}
        {tab==="clima"     && <ModuloClima />}
        {tab==="costos"    && <ModuloCostos />}
        {tab==="plagas"    && <ModuloPlagas onToast={showToast} />}
        {tab==="mercado"   && <ModuloMercado />}
        {tab==="asistente" && <ModuloAsistente />}
      </div>

      {/* BOTTOM NAV */}
      <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)",
        width:"100%", maxWidth:480, background:C.panel, borderTop:`1px solid ${C.border}`,
        display:"flex", justifyContent:"space-around", padding:"10px 0 16px", zIndex:100 }}>
        {NAV.map(t => {
          const isAI   = t.id === "asistente";
          const active = tab === t.id;
          return (
            <button key={t.id} onClick={() => setTab(t.id)} style={{
              display:"flex", flexDirection:"column", alignItems:"center", gap:2,
              background: isAI && active ? C.green : "none",
              border: isAI && !active ? `1px solid ${C.green}55` : "none",
              borderRadius: isAI ? 12 : 0,
              padding: isAI ? "5px 8px" : "0",
              cursor:"pointer", fontFamily:"inherit",
              color: active ? (isAI ? C.white : C.green) : isAI ? C.green : C.muted,
              minWidth: 48,
            }}>
              <span style={{ fontSize: isAI ? 16 : 20 }}>{t.icon}</span>
              <span style={{ fontSize:8, fontWeight:active?700:400, textTransform:"uppercase", letterSpacing:.3 }}>{t.label}</span>
              {active && !isAI && <div style={{ width:4, height:4, borderRadius:"50%", background:C.green }} />}
            </button>
          );
        })}
      </div>
    </div>
  );
}
    ReactDOM.createRoot(document.getElementById('root')).render(<SurcoApp />);
  </script>
