const Card = ({ children, style={} }) => (
  <div style={{ background:C.panel, border:`1px solid ${C.border}`, borderRadius:16, padding:18, ...style }}>
    {children}
  </div>
);
const Badge = ({ children, color, bg }) => (
  <span style={{ background:bg, color, borderRadius:20, padding:"3px 10px", fontSize:11, fontWeight:700 }}>{children}</span>
);
const Btn = ({ children, onClick, variant="primary", full, small, style={} }) => (
  <button onClick={onClick} style={{
    width:full?"100%":"auto", padding:small?"8px 14px":"12px 20px",
    borderRadius:10, fontSize:small?12:14, fontWeight:700, fontFamily:"inherit", cursor:"pointer", border:"none",
    background:variant==="primary"?C.green:variant==="gold"?C.gold:variant==="red"?C.red:variant==="ghost"?"transparent":C.panel,
    color:variant==="primary"||variant==="gold"||variant==="red"?C.white:variant==="ghost"?C.muted:C.green,
    ...(variant==="outline"?{border:`1.5px solid ${C.green}`,background:"transparent",color:C.green}:{}),
    ...(variant==="ghost"?{border:`1px solid ${C.border}`}:{}),
    ...style,
  }}>{children}</button>
);
const Divider = () => <div style={{ height:1, background:C.border, margin:"14px 0" }} />;
const SLabel = ({ children }) => (
  <div style={{ fontSize:11, color:C.muted, textTransform:"uppercase", letterSpacing:1.5, marginBottom:10 }}>{children}</div>

// ─── MÓDULO CAMPO ─────────────────────────────────────────────────────────────
function ModuloCampo() {
  const [campoSel, setCampoSel] = useState(CAMPOS[0]);
  const [etapaSel, setEtapaSel] = useState(campoSel.etapaActual);
  const etapas = FENOLOGIA[campoSel.cultivo]||[];
  const etapa  = etapas[etapaSel];

  return (
    <div>
      <div style={{ display:"flex", gap:8, marginBottom:16 }}>
        {CAMPOS.map(c => (
          <button key={c.id} onClick={() => { setCampoSel(c); setEtapaSel(c.etapaActual); }} style={{
            flex:1, background: campoSel.id===c.id?C.green:C.panel,
            color: campoSel.id===c.id?C.white:C.muted,
            border:`1px solid ${campoSel.id===c.id?C.green:C.border}`,
            borderRadius:20, padding:"7px 12px", fontSize:12, cursor:"pointer", fontFamily:"inherit",
          }}>{c.icon} {c.nombre.split(" ").slice(-1)[0]}</button>
        ))}
        <button style={{ background:"transparent", color:C.green, border:`1px dashed ${C.green}`,
          borderRadius:20, padding:"7px 12px", fontSize:12, cursor:"pointer", fontFamily:"inherit" }}>+</button>
      </div>

      <Card style={{ marginBottom:16, borderLeft:`4px solid ${C.green}` }}>
        <div style={{ display:"flex", gap:12, alignItems:"flex-start" }}>
          <span style={{ fontSize:40 }}>{campoSel.icon}</span>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:17, fontWeight:700, color:C.earth }}>{campoSel.nombre}</div>
            <div style={{ fontSize:12, color:C.muted }}>📍 {campoSel.comuna}, {campoSel.region}</div>
            <div style={{ display:"flex", gap:16, marginTop:10, flexWrap:"wrap" }}>
              {[
                { l:"Variedad", v:campoSel.variedad },
                { l:"Superficie", v:`${campoSel.ha} ha` },
                { l:"Plantación", v:campoSel.anoPlantacion },
                { l:"Riego", v:campoSel.riego },
              ].map((d,i) => (
                <div key={i}>
                  <div style={{ fontSize:10, color:C.muted, textTransform:"uppercase", letterSpacing:1 }}>{d.l}</div>
                  <div style={{ fontSize:13, fontWeight:600, color:C.earth, marginTop:1 }}>{d.v}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </Card>

      <SLabel>🌿 Fenología · {campoSel.cultivoLabel}</SLabel>
      <div style={{ display:"flex", gap:4, marginBottom:16, overflowX:"auto", paddingBottom:4 }}>
        {etapas.map((e,i) => (
          <div key={i} onClick={() => setEtapaSel(i)} style={{
            flex:"0 0 auto", textAlign:"center", cursor:"pointer",
            padding:"8px 6px", borderRadius:12, minWidth:58,
            background: etapaSel===i?C.gold:i<campoSel.etapaActual?C.greenPale:C.panel,
            border:`2px solid ${etapaSel===i?C.gold:i===campoSel.etapaActual?C.green:C.border}`,
          }}>
            <div style={{ fontSize:18 }}>{e.icon}</div>
            <div style={{ fontSize:9, color:etapaSel===i?C.gold:C.muted, fontWeight:etapaSel===i?700:400, marginTop:4, lineHeight:1.3 }}>{e.nombre}</div>
          </div>
        ))}
      </div>

      {etapa && (
        <Card style={{ background: etapaSel===campoSel.etapaActual?C.goldPale:C.bg,
          border:`1.5px solid ${etapaSel===campoSel.etapaActual?C.gold+"55":C.border}` }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
            <div style={{ fontSize:15, fontWeight:700, color:C.earth }}>{etapa.icon} {etapa.nombre} · {etapa.meses}</div>
            {etapaSel===campoSel.etapaActual && <Badge color={C.gold} bg={C.goldPale+"aa"}>Etapa actual</Badge>}
          </div>
          {etapa.tareas.map((t,i) => (
            <div key={i} style={{ display:"flex", gap:10, alignItems:"flex-start",
              padding:"8px 0", borderBottom:i<etapa.tareas.length-1?`1px solid ${C.border}`:"none" }}>
              <div style={{ width:18, height:18, borderRadius:5, border:`2px solid ${C.border}`, flexShrink:0, marginTop:1 }} />
              <span style={{ fontSize:13, color:C.text, lineHeight:1.5 }}>{t}</span>
            </div>
          ))}
        </Card>
      )}
    </div>
  );
}

// ─── MÓDULO SII ───────────────────────────────────────────────────────────────

const MESES_ES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio",
                  "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const IVA_TASA = 0.19;

const fmtPesos = n => "$" + Math.round(n).toLocaleString("es-CL");

function diasHasta(fecha) {
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  return Math.ceil((fecha - hoy) / 86400000);
}

function getCalendario() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const f29 = new Date(y, m + 1, 20);
  const f22 = new Date(y, 3, 30);
  const libros = new Date(y, m + 1, 20);
  return [
    { id:"f29",    icon:"📊", tramite:"Formulario 29 — IVA",          periodo:`${MESES_ES[m]} ${y}`,  fecha:f29,    desc:"Declaración mensual de IVA y PPM",              tipo:"mensual" },
    { id:"f22",    icon:"📋", tramite:"Formulario 22 — Renta Anual",   periodo:`Año ${y-1}`,           fecha:f22,    desc:"Declaración anual del Impuesto a la Renta",     tipo:"anual"   },
    { id:"libros", icon:"📒", tramite:"Libros Electrónicos IVA",       periodo:`${MESES_ES[m]} ${y}`,  fecha:libros, desc:"Registro de Compras y Ventas en SII",           tipo:"mensual" },
  ].map(e => ({ ...e, dias: diasHasta(e.fecha) }))
   .sort((a,b) => a.fecha - b.fecha);
}

// ── Calendario tributario ──────────────────────────────────────────────────────
function CalendarioSII({ onIrF29, onIrF22 }) {
  const calendario = getCalendario();
  const urgBadge = dias => {
    if (dias < 0)  return { label:"Vencido",    c:C.red,    bg:C.redPale    };
    if (dias <= 5) return { label:`${dias}d`,   c:C.red,    bg:C.redPale    };
    if (dias <= 15)return { label:`${dias}d`,   c:C.orange, bg:C.orangePale };
    return           { label:`${dias}d`,   c:C.green,  bg:C.greenPale  };
  };
  return (
    <div>
      <div style={{ background:C.bluePale, border:`1px solid ${C.blue}33`, borderRadius:12,
        padding:"10px 14px", marginBottom:16, fontSize:13, color:C.earth, lineHeight:1.6 }}>
        📅 El <strong>F29</strong> vence el <strong>día 20</strong> del mes siguiente al período declarado.
        Declara antes del día 12 para tener margen de revisión.
      </div>
      {calendario.map(ev => {
        const urg = urgBadge(ev.dias);
        return (
          <div key={ev.id} onClick={() => ev.tipo==="anual" ? onIrF22() : onIrF29()}
            style={{ background:C.panel, border:`1.5px solid ${urg.bg}`,

              marginBottom:12, cursor:"pointer" }}>
            <div style={{ display:"flex", gap:12, alignItems:"center" }}>
              <span style={{ fontSize:28 }}>{ev.icon}</span>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:14, fontWeight:700, color:C.earth }}>{ev.tramite}</div>
                <div style={{ fontSize:12, color:C.muted, marginTop:2 }}>
                  Período: {ev.periodo} · Vence: {ev.fecha.toLocaleDateString("es-CL")}
                </div>
                <div style={{ fontSize:12, color:C.muted }}>{ev.desc}</div>
              </div>
              <Badge color={urg.c} bg={urg.bg}>{urg.label}</Badge>
            </div>
          </div>
        );
      })}
      <div style={{ background:C.greenPale, borderRadius:12, padding:14 }}>
        <div style={{ fontSize:12, fontWeight:700, color:C.green, marginBottom:8 }}>✅ Buenas prácticas SII</div>
        {["Guarda tus facturas de compra en formato electrónico (XML)",

          <div key={i} style={{ fontSize:12, color:C.earth, padding:"5px 0",
            borderBottom:i<3?`1px solid ${C.border}`:"none" }}>· {t}</div>

function GestorBoletas({ onToast }) {
  const [boletas, setBoletas] = useState([
    { id:1, numero:"B-001", fecha:"15/05/2026", cliente:"Pedro González",      monto:119000, detalle:"Asesoría agrícola" },
    { id:2, numero:"B-002", fecha:"20/05/2026", cliente:"Agrícola San José",   monto:238000, detalle:"Consultoría ciruela" },
  ]);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm]         = useState({ cliente:"", detalle:"", montoNeto:"" });

  const totalBruto = boletas.reduce((s,b) => s + b.monto, 0);
  const totalNeto  = boletas.reduce((s,b) => s + Math.round(b.monto / 1.19), 0);
  const totalIVA   = totalBruto - totalNeto;

  const agregar = () => {
    const neto = parseFloat(form.montoNeto.replace(/\./g,"").replace(",",".")) || 0;
    if (!neto || !form.cliente) return;
    setBoletas(prev => [...prev, {
      id: Date.now(),
      numero: `B-${String(prev.length + 1).padStart(3,"0")}`,
      fecha: new Date().toLocaleDateString("es-CL"),
      cliente: form.cliente,
      monto: Math.round(neto * 1.19),
      detalle: form.detalle,
    }]);
    setForm({ cliente:"", detalle:"", montoNeto:"" });
    setShowForm(false);
    onToast("✅ Boleta registrada");
  };

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
        <div>
          <div style={{ fontSize:16, fontWeight:700, color:C.earth }}>Boletas emitidas</div>
          <div style={{ fontSize:12, color:C.muted }}>{boletas.length} documentos</div>
        </div>

  );
}

// ── Asistente IA (Paso 2) ─────────────────────────────────────────────────────
const SII_PROMPT = `Eres un asistente tributario experto en el sistema impositivo chileno y el SII (Servicio de Impuestos Internos) de Chile. El usuario es un agricultor/empresario agrícola que usa la app Surco.

Tu especialidad:
- Formulario 29: IVA débito/crédito, remanentes, PPM, plazos (día 20 del mes siguiente)
- Formulario 22: renta anual, créditos, devoluciones, plazo 30 de abril
- IVA: tasa 19%, exenciones agrícolas, proporcionalidad, crédito fiscal
- Boletas y facturas electrónicas: emisión, anulación, libros electrónicos
- Renta presunta agrícola (Régimen 14D8): bienes raíces agrícolas, avalúo fiscal
- Regímenes tributarios: 14A (contabilidad completa), 14D3 (transparencia), 14D8 (renta presunta)
- PPM: tasas vigentes, cómo imputarlos en el F22
- Plazos y vencimientos: calendario tributario chileno
- Cómo navegar el portal sii.cl paso a paso

Responde siempre en español. Sé directo y práctico — el usuario necesita saber qué hacer, no teoría. Usa listas cuando sea útil. Máximo 4 párrafos salvo que pidan más detalle. Si hay tasas o plazos que pueden cambiar, sugiere verificar en sii.cl.`;

const SUGERENCIAS = [
  "¿Cuándo vence mi F29 de este mes?",
  "¿Cómo calculo el IVA a pagar?",
  "¿Qué es la renta presunta agrícola?",
  "¿Qué gastos puedo descontar en el F22?",
  "¿Cómo anulo una boleta electrónica?",
  "¿Cuál es la tasa del PPM para agrícola?",
];

function AsistenteSII() {
  const [apiKey, setApiKey]   = useState(() => localStorage.getItem("surco_ak") || "");
  const [keyInput, setKeyInput] = useState("");
  const [showKey, setShowKey]   = useState(false);
  const [msgs, setMsgs]         = useState([
    { role:"assistant", content:"Hola 👋 Soy tu asistente tributario para el SII Chile. Puedo ayudarte con el F29 (IVA), F22 (renta), boletas, facturas y plazos. ¿En qué te ayudo hoy?" }
  ]);
  const [input, setInput]   = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError]     = useState("");
  const endRef = useRef(null);

  useEffect(() => { endRef.current?.scrollIntoView({ behavior:"smooth" }); }, [msgs, loading]);

  const guardarKey = () => {
    const k = keyInput.trim();
    if (!k) return;
    localStorage.setItem("surco_ak", k);
    setApiKey(k);
    setKeyInput("");
  };

  const olvidarKey = () => {
    localStorage.removeItem("surco_ak");
    setApiKey("");
    setMsgs([{ role:"assistant", content:"Hola 👋 Soy tu asistente tributario para el SII Chile. Puedo ayudarte con el F29 (IVA), F22 (renta), boletas, facturas y plazos. ¿En qué te ayudo hoy?" }]);
  };

  const enviar = async (texto) => {
    const txt = (texto || input).trim();
    if (!txt || loading) return;
    setInput("");
    setError("");
    const userMsg = { role:"user", content:txt };
    setMsgs(prev => [...prev, userMsg]);
    setLoading(true);

    // Construir historial para la API (omite el saludo inicial del asistente)
    const historial = [...msgs.slice(1), userMsg];

    try {
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
          "content-type": "application/json",
        },
        body: JSON.stringify({
          model: "claude-haiku-4-5-20251001",
          max_tokens: 1024,
          system: SII_PROMPT,
          messages: historial.slice(-12),
        }),
      });

      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error?.message || `Error ${resp.status}`);
      const reply = data.content?.[0]?.text || "(sin respuesta)";
      setMsgs(prev => [...prev, { role:"assistant", content:reply }]);
    } catch(e) {
      setError(e.message);
      setMsgs(prev => prev.slice(0,-1)); // revierte el mensaje del usuario si falla
    } finally {
      setLoading(false);
    }
  };

  // ── Pantalla de configuración de API key ─────────────────────────────────────
  if (!apiKey) {
    return (
      <div>
        <div style={{ background:`linear-gradient(135deg,${C.purplePale},${C.bluePale})`,
          border:`1.5px solid ${C.purple}33`, borderRadius:16, padding:24, textAlign:"center", marginBottom:16 }}>
          <div style={{ fontSize:48, marginBottom:10 }}>🤖</div>
          <div style={{ fontSize:17, fontWeight:700, color:C.earth, marginBottom:6 }}>Asistente Tributario IA</div>
          <div style={{ fontSize:13, color:C.muted, lineHeight:1.7, marginBottom:4 }}>
            Resuelve tus dudas del SII al instante: IVA, renta, boletas, plazos y más.
          </div>
          <div style={{ fontSize:12, color:C.muted }}>Powered by Claude (Anthropic)</div>
        </div>

        <Card>
          <div style={{ fontSize:13, fontWeight:700, color:C.earth, marginBottom:12 }}>🔑 Configurar API Key</div>
          <div style={{ fontSize:12, color:C.muted, lineHeight:1.6, marginBottom:14 }}>
            Para usar el asistente necesitas una API key de Anthropic.
            Créala gratis en <strong>console.anthropic.com</strong>.
            Se guardará solo en este dispositivo.
          </div>
          <div style={{ fontSize:11, color:C.muted, marginBottom:6, textTransform:"uppercase", letterSpacing:1 }}>
            Tu API Key
          </div>
          <div style={{ display:"flex", gap:8, marginBottom:10 }}>
            <div style={{ flex:1, display:"flex", border:`1.5px solid ${C.border}`,
              borderRadius:8, background:C.white, overflow:"hidden" }}>
              <input
                type={showKey?"text":"password"}
                value={keyInput}
                onChange={e => setKeyInput(e.target.value)}
                onKeyDown={e => e.key==="Enter" && guardarKey()}
                placeholder="sk-ant-api03-..."
                style={{ flex:1, padding:"10px 12px", border:"none", fontSize:13,
                  fontFamily:"inherit", background:"transparent", outline:"none" }}
              />
              <button onClick={()=>setShowKey(s=>!s)} style={{ padding:"0 10px", background:"none",
                border:"none", color:C.muted, cursor:"pointer", fontSize:14 }}>
                {showKey?"🙈":"👁️"}
              </button>
            </div>
          </div>
          <Btn full onClick={guardarKey}>Activar asistente →</Btn>
          <div style={{ marginTop:12, background:C.goldPale, borderRadius:8, padding:"10px 12px",
            fontSize:12, color:C.earthMid, lineHeight:1.5 }}>
            🔒 La key se almacena solo en <strong>localStorage</strong> de tu navegador y nunca se envía a ningún servidor de Surco.
          </div>
        </Card>
      </div>
    );
  }

  // ── Chat ──────────────────────────────────────────────────────────────────────
  return (
    <div style={{ display:"flex", flexDirection:"column" }}>

      {/* Header del chat */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
        <div style={{ display:"flex", gap:10, alignItems:"center" }}>
          <div style={{ width:38, height:38, borderRadius:"50%", background:`linear-gradient(135deg,${C.purple},${C.blue})`,
            display:"flex", alignItems:"center", justifyContent:"center", fontSize:18 }}>🤖</div>
          <div>
            <div style={{ fontSize:14, fontWeight:700, color:C.earth }}>Asistente Tributario</div>
            <div style={{ fontSize:11, color:C.green }}>🟢 Claude · SII Chile</div>
          </div>
        </div>
        <button onClick={olvidarKey} style={{ fontSize:11, color:C.muted, background:"none",
          border:`1px solid ${C.border}`, borderRadius:20, padding:"4px 10px",
          cursor:"pointer", fontFamily:"inherit" }}>
          Cambiar key
        </button>
      </div>

      {/* Burbujas de mensajes */}
      <div style={{ maxHeight:"52vh", overflowY:"auto", display:"flex",
        flexDirection:"column", gap:10, marginBottom:10, paddingRight:2 }}>
        {msgs.map((m, i) => (
          <div key={i} style={{ display:"flex",
            justifyContent:m.role==="user"?"flex-end":"flex-start",
            alignItems:"flex-end", gap:6 }}>
            {m.role==="assistant" && (
              <div style={{ width:26, height:26, borderRadius:"50%", flexShrink:0,
                background:`linear-gradient(135deg,${C.purple},${C.blue})`,
                display:"flex", alignItems:"center", justifyContent:"center", fontSize:12 }}>🤖</div>
            )}
            <div style={{
              maxWidth:"82%", padding:"10px 14px", fontSize:13, lineHeight:1.65,
              borderRadius:16,
              borderBottomRightRadius: m.role==="user"?4:16,
              borderBottomLeftRadius:  m.role==="assistant"?4:16,
              background: m.role==="user"?C.green:C.panel,
              color:       m.role==="user"?C.white:C.text,
              border:      m.role==="assistant"?`1px solid ${C.border}`:"none",
              whiteSpace:"pre-wrap",
            }}>
              {m.content}
            </div>
          </div>
        ))}

        {/* Indicador "pensando" */}
        {loading && (
          <div style={{ display:"flex", alignItems:"flex-end", gap:6 }}>
            <div style={{ width:26, height:26, borderRadius:"50%", flexShrink:0,
              background:`linear-gradient(135deg,${C.purple},${C.blue})`,
              display:"flex", alignItems:"center", justifyContent:"center", fontSize:12 }}>🤖</div>
            <div style={{ background:C.panel, border:`1px solid ${C.border}`,
              borderRadius:16, borderBottomLeftRadius:4, padding:"10px 14px" }}>
              <div style={{ display:"flex", gap:4, alignItems:"center" }}>
                {[0,1,2].map(j => (
                  <div key={j} style={{ width:7, height:7, borderRadius:"50%", background:C.purple,
                    opacity:0.4, animation:`sii-bounce 1.2s ${j*0.2}s infinite` }} />
                ))}
              </div>
            </div>
          </div>
        )}
        <div ref={endRef} />
      </div>

      {/* CSS para animación de los puntos */}
      <style>{`
        @keyframes sii-bounce {
          0%,80%,100%{transform:translateY(0);opacity:.4}
          40%{transform:translateY(-5px);opacity:1}
        }
      `}</style>

      {/* Error */}
      {error && (
        <div style={{ background:C.redPale, border:`1px solid ${C.red}33`, borderRadius:8,
          padding:"8px 12px", fontSize:12, color:C.red, marginBottom:8 }}>
          ⚠️ {error} — verifica tu API key o intenta de nuevo.
        </div>
      )}

      {/* Sugerencias rápidas (solo al inicio) */}
      {msgs.length <= 1 && (
        <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:10 }}>
          {SUGERENCIAS.map((s,i) => (
            <button key={i} onClick={() => enviar(s)} style={{
              fontSize:11, padding:"6px 11px", borderRadius:20,
              background:C.purplePale, color:C.purple,
              border:`1px solid ${C.purple}33`, cursor:"pointer",
              fontFamily:"inherit", lineHeight:1.4,
            }}>{s}</button>
          ))}
        </div>
      )}

      {/* Input */}
      <div style={{ display:"flex", gap:8 }}>
        <input
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => e.key==="Enter" && !e.shiftKey && enviar()}
          placeholder="Escribe tu consulta tributaria..."
          disabled={loading}
          style={{ flex:1, padding:"11px 14px", borderRadius:12,
            border:`1.5px solid ${input?C.purple:C.border}`,
            fontSize:13, fontFamily:"inherit", background:C.white,
            outline:"none", transition:"border-color 0.2s" }}
        />
        <button onClick={() => enviar()} disabled={loading || !input.trim()} style={{
          width:44, height:44, borderRadius:12,
          background: loading||!input.trim() ? C.border : `linear-gradient(135deg,${C.purple},${C.blue})`,
          color:C.white, border:"none", fontSize:18,
          cursor: loading||!input.trim() ? "not-allowed" : "pointer",
          display:"flex", alignItems:"center", justifyContent:"center",
          transition:"background 0.2s", flexShrink:0,
        }}>↑</button>
      </div>
    </div>
  );
}

        position:"sticky", top:0, zIndex:50 }}>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <span style={{ fontSize:22 }}>🌿</span>
          <div>
            <div style={{ color:C.white, fontWeight:700, fontSize:18, letterSpacing:0.5 }}>Surco</div>
            <div style={{ color:C.greenLight, fontSize:10, letterSpacing:2, textTransform:"uppercase" }}>
              {SECTION_TITLES[tab] || "Surco"}
            </div>
          </div>
        </div>
        <div style={{ display:"flex", gap:8, alignItems:"center" }}>
          {/* Botón mercado */}
          <button onClick={() => navTo("mercado")} style={{
            background:"rgba(255,255,255,0.15)", border:"none", color:C.white,
            borderRadius:20, padding:"5px 12px", fontSize:12, cursor:"pointer", fontFamily:"inherit",
          }}>📊 Mercado</button>
          <div style={{ background:"rgba(255,255,255,0.15)", borderRadius:20,
            padding:"5px 12px", fontSize:12, color:C.white }}>
            🚨 3
          </div>
        </div>
      </div>

      {/* CONTENT */}
      <div style={{ padding:"20px 16px" }}>
        {tab==="home"     && <ModuloHome onNavCampo={()=>navTo("campo")} onNavClima={()=>navTo("clima")} onNavCuaderno={()=>navTo("cuaderno")} onNavPlagas={()=>navTo("plagas")} onNavMercado={()=>navTo("mercado")} />}
        {tab==="campo"    && <ModuloCampo />}
        {tab==="cuaderno" && <ModuloCuaderno />}
        {tab==="clima"    && <ModuloClima />}
        {tab==="plagas"   && <ModuloPlagas onToast={showToast} />}
        {tab==="mercado"  && <ModuloMercado />}
        {tab==="sii"      && <ModuloSII onToast={showToast} />}
      </div>

      {/* BOTTOM NAV */}
      <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)",
        width:"100%", maxWidth:480, background:C.panel, borderTop:`1px solid ${C.border}`,
        display:"flex", justifyContent:"space-around", padding:"8px 0 14px", zIndex:100 }}>
        {NAV.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{
            display:"flex", flexDirection:"column", alignItems:"center", gap:2,
            background:"none", border:"none", cursor:"pointer", fontFamily:"inherit",
            color:tab===t.id?C.green:C.muted, flex:1,
          }}>
            <span style={{ fontSize:18 }}>{t.icon}</span>
            <span style={{ fontSize:8, fontWeight:tab===t.id?700:400, textTransform:"uppercase", letterSpacing:.5 }}>{t.label}</span>
            {tab===t.id && <div style={{ width:4, height:4, borderRadius:"50%", background:C.green }} />}
          </button>
        ))}
      </div>
    </div>
  );
}
    ReactDOM.createRoot(document.getElementById('root')).render(<SurcoApp />);
  </script>
</body>
</html>
